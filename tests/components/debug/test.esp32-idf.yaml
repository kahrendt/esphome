<<: !include common.yaml

esp32:
  cpu_frequency: 240MHz

sensor:
  - platform: debug
    free:
      name: "Heap Free"
    psram:
      name: "Free PSRAM"
    fragmentation:
      name: "Heap Fragmentation"
    min_free:
      name: "Heap Min Free"
    cpu_idle:
      name: "CPU Idle"
    cores:
      - core: 0
        name: "Core 0 Idle"
      - core: 1
        name: "Core 1 Idle"
    tasks:
      - task_name: "loopTask"
        name: "Loop Task CPU"
      - task_name: "esp_timer"
        name: "Timer Task CPU"

psram:
